version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8085:8085"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/lifepill
      - JWT_SECRET=${JWT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - PORT=8085
    depends_on:
      - mongo
    networks:
      - lifepill-network
    restart: unless-stopped

  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    volumes:
      - mongo-data:/data/db
    networks:
      - lifepill-network
    restart: unless-stopped

volumes:
  mongo-data:

networks:
  lifepill-network:
    driver: bridge
